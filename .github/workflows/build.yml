name: Windows test and package
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name AutoStatement --manifest packaging/app.manifest --add-data "assets;assets" --add-data "docs;docs" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoStatement-Windows
          path: dist/AutoStatement
